<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퀀트 터미널</title>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-today" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></symbol>
  <symbol id="i-market" viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M4 15l5-5 4 3 7-7"/></symbol>
  <symbol id="i-stock" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4v13H6z"/><path d="M14 3.5v4h4M9 12h6M9 16h6"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M7 4v4M7 15v5M17 6v4M17 15v4"/><rect x="5" y="8" width="4" height="7" rx="1"/><rect x="15" y="10" width="4" height="5" rx="1"/></symbol>
  <symbol id="i-account" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="13" rx="2"/><path d="M3.5 10h17"/><circle cx="16.5" cy="14.5" r="1"/></symbol>
  <symbol id="i-score" viewBox="0 0 24 24"><path d="M5 20v-8M12 20V5M19 20v-5"/></symbol>
  <symbol id="i-verify" viewBox="0 0 24 24"><path d="M9 3.5h6M10 3.5v6l-5.2 8.7a1.5 1.5 0 0 0 1.3 2.3h11.8a1.5 1.5 0 0 0 1.3-2.3L14 9.5v-6"/><path d="M7.5 14.5h9"/></symbol>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
  <symbol id="i-collect" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4.5h-4.5"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 17.5h2"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.25" fill="currentColor"/><circle cx="12" cy="12" r="1.25" fill="currentColor"/><circle cx="19" cy="12" r="1.25" fill="currentColor"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></symbol>
</svg>
<header class="top">
  <button id="navtoggle" class="ghost nav-toggle" type="button" aria-controls="side" aria-expanded="true" aria-label="메뉴 접기" title="메뉴 접기"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>
  <div class="brand">퀀트 터미널 <span class="ver">QSF</span></div>
  <span class="seg" id="market" role="group" aria-label="시장"><button type="button" data-m="US">미국</button><button type="button" data-m="KR">한국</button><button type="button" data-m="COIN">코인</button></span>
  <form id="search" class="search" autocomplete="off">
    <input id="q" name="q" placeholder="종목 코드 또는 회사명" maxlength="30" aria-label="종목 코드 또는 회사명">
    <button type="submit">조회</button>
  </form>
  <span class="top-chips">
    <button type="button" id="mstate" class="top-chip" hidden></button>
    <button type="button" id="datatime" class="top-chip" hidden></button>
  </span>
  <span class="top-acts">
  <button id="acctbtn" class="ghost" type="button" title="미국·한국 주식과 코인을 한 페이지에서 봅니다.">내 계좌</button>
  <button id="collect" class="ghost" type="button" title="최신 자료 수집: 매일 자동 실행과 같은 작업을 지금 시작합니다. 이미 끝난 단계는 건너뜁니다.">지금 수집</button>
  <button id="phonebtn" class="ghost" type="button" title="같은 와이파이의 휴대폰에서 이 화면을 엽니다. 기본은 꺼져 있습니다." hidden>폰 연결</button>
  <button id="cmdbtn" class="ghost" type="button" title="명령창 (/ 또는 ⌘K)" aria-label="명령창 열기 (⌘K)">⌘K</button>
  <button id="keysbtn" class="ghost" type="button" hidden>한 글자 단축키 끄기</button>
  <button id="theme" class="ghost" title="화면 테마 전환" aria-label="화면 테마 전환">◐</button>
  </span>
  <button id="topmore" class="ghost" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="topmenu" aria-label="도구 더 보기" title="도구 더 보기"><svg class="ico" aria-hidden="true"><use href="#i-more"/></svg></button>
</header>
<div class="topmenu" id="topmenu" role="dialog" aria-label="도구" hidden></div>
<div class="statusbars" id="statusbars">
  <div id="collectbar" class="collectbar" role="status" aria-live="polite" hidden></div>
  <div id="phonebar" class="phonebar" hidden></div>
  <div id="netbar" class="netbar" role="alert" hidden></div>
  <div id="verbar" class="verbar" role="status" hidden></div>
</div>
<div class="shell">
  <aside class="side" id="side" aria-label="메뉴">
  <nav class="groups" id="groups" aria-label="묶음">
    <button type="button" data-group="today" class="on">오늘</button>
    <button type="button" data-group="market">시장</button>
    <button type="button" data-group="stock">종목</button>
    <button type="button" data-group="chart">차트</button>
    <button type="button" data-group="account">내 계좌</button>
    <button type="button" data-group="score">점수</button>
    <button type="button" data-group="verify">검증·기록</button>
    <button type="button" data-group="coin" hidden>코인</button>
  </nav>
  <nav class="tabs" aria-label="탭">
    <div class="nav-grp" data-group="today" role="group" aria-labelledby="nh-today">
      <span class="nav-h" id="nh-today"><svg class="ico" aria-hidden="true"><use href="#i-today"/></svg><span class="nav-ht">오늘</span></span>
      <button data-tab="today" data-group="today" class="on">오늘</button>
    </div>
    <div class="nav-grp" data-group="market" role="group" aria-labelledby="nh-market">
      <span class="nav-h" id="nh-market"><svg class="ico" aria-hidden="true"><use href="#i-market"/></svg><span class="nav-ht">시장</span></span>
      <button data-tab="overview" data-group="market">시장 개요</button>
      <button data-tab="map" data-group="market">시장 지도</button>
      <button data-tab="macro" data-group="market">거시</button>
    </div>
    <div class="nav-grp" data-group="stock" role="group" aria-labelledby="nh-stock">
      <span class="nav-h" id="nh-stock"><svg class="ico" aria-hidden="true"><use href="#i-stock"/></svg><span class="nav-ht">종목</span></span>
      <button data-tab="stock" data-group="stock">종목 정보</button>
      <button data-tab="watch" data-group="stock">관심종목</button>
    </div>
    <div class="nav-grp" data-group="chart" role="group" aria-labelledby="nh-chart">
      <span class="nav-h" id="nh-chart"><svg class="ico" aria-hidden="true"><use href="#i-chart"/></svg><span class="nav-ht">차트</span></span>
      <button data-tab="chart" data-group="chart">차트분석</button>
      <button data-tab="compare" data-group="chart">비교</button>
    </div>
    <div class="nav-grp" data-group="account" role="group" aria-labelledby="nh-account">
      <span class="nav-h" id="nh-account"><svg class="ico" aria-hidden="true"><use href="#i-account"/></svg><span class="nav-ht">내 계좌</span></span>
      <button data-tab="account" data-group="account">통합 계좌</button>
      <button data-tab="portfolio" data-group="account">시장별 자세히</button>
      <button data-tab="assist" data-group="account">매매 보조</button>
      <button data-tab="paper" data-group="account">모의 매매</button>
    </div>
    <div class="nav-grp" data-group="score" role="group" aria-labelledby="nh-score">
      <span class="nav-h" id="nh-score"><svg class="ico" aria-hidden="true"><use href="#i-score"/></svg><span class="nav-ht">점수</span></span>
      <button data-tab="qsf" data-group="score">순위·카드</button>
      <button data-tab="committee" data-group="score">투자위원회</button>
    </div>
    <div class="nav-grp" data-group="verify" role="group" aria-labelledby="nh-verify">
      <span class="nav-h" id="nh-verify"><svg class="ico" aria-hidden="true"><use href="#i-verify"/></svg><span class="nav-ht">검증·기록</span></span>
      <button data-tab="model" data-group="verify">모델</button>
      <button data-tab="lab" data-group="verify">연구실</button>
    </div>
    <div class="nav-grp" data-group="coin" role="group" aria-labelledby="nh-coin" hidden>
      <span class="nav-h" id="nh-coin"><svg class="ico" aria-hidden="true"><use href="#i-coin"/></svg><span class="nav-ht">코인</span></span>
      <button data-tab="coin" data-group="coin">코인</button>
    </div>
  </nav>
  </aside>
  <div class="content">
<main>
  <h1 id="pagetitle" class="sr-only">퀀트 터미널</h1>
  <section id="tab-today" class="tab on"></section>
  <section id="tab-overview" class="tab"></section>
  <section id="tab-map" class="tab"></section>
  <section id="tab-stock" class="tab"></section>
  <section id="tab-compare" class="tab"></section>
  <section id="tab-chart" class="tab"></section>
  <section id="tab-macro" class="tab"></section>
  <section id="tab-watch" class="tab"></section>
  <section id="tab-account" class="tab"></section>
  <section id="tab-portfolio" class="tab"></section>
  <section id="tab-assist" class="tab"></section>
  <section id="tab-paper" class="tab"></section>
  <section id="tab-model" class="tab"></section>
  <section id="tab-lab" class="tab"></section>
  <section id="tab-qsf" class="tab"></section>
  <section id="tab-committee" class="tab"></section>
  <section id="tab-coin" class="tab"></section>
</main>
<footer class="foot">
  무료 공개 데이터(Yahoo Finance 지연 시세 · SEC EDGAR · FRED)만 사용합니다. 실시간 시세가 아니며, 투자 권유가 아닌 연구용 정보입니다.
  주문 기능은 없습니다. <span id="health"></span>
</footer>
  </div>
</div>
<div class="scrim" id="navscrim" hidden></div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<nav class="bottombar" id="bottombar" aria-label="아래 메뉴">
  <button type="button" data-group="today">오늘</button>
  <button type="button" data-group="stock">종목</button>
  <button type="button" data-group="score">점수</button>
  <button type="button" data-group="coin" hidden>코인</button>
  <button type="button" data-group="account">내 계좌</button>
  <button type="button" data-more aria-haspopup="true" aria-expanded="false" aria-controls="moresheet">더보기</button>
</nav>
<div class="moresheet" id="moresheet" role="dialog" aria-label="더보기" hidden></div>
<script src="ui.js"></script>
<script src="app.js"></script>
<script src="portfolio.js"></script>
<script src="account.js"></script>
<script src="paper.js"></script>
<script src="alerts.js"></script>
<script src="calendar.js"></script>
<script src="lab.js"></script>
<script src="qsf.js"></script>
<script src="committee.js"></script>
<script src="forecast.js"></script>
<script src="compare.js"></script>
<script src="chart.js"></script>
<script src="map.js"></script>
<script src="rotation.js"></script>
<script src="sectorpicks.js"></script>
<script src="peers.js"></script>
<script src="assistant.js"></script>
<script src="coin.js"></script>
<script src="command.js"></script>
<script src="collect.js"></script>
<script src="phone.js"></script>
</body>
</html>
