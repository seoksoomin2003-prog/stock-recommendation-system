<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퀀트 터미널</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">퀀트 터미널 <span class="ver">QSF 1.1</span></div>
  <span class="seg" id="market" role="group" aria-label="시장"><button type="button" data-m="US">미국</button><button type="button" data-m="KR">한국</button></span>
  <form id="search" class="search" autocomplete="off">
    <input id="q" name="q" placeholder="종목 코드 또는 한글 회사명" maxlength="30" aria-label="종목 코드 또는 회사명">
    <button type="submit">조회</button>
  </form>
  <button id="theme" class="ghost" title="화면 테마 전환" aria-label="화면 테마 전환">◐</button>
</header>
<nav class="tabs" role="tablist">
  <button data-tab="overview" class="on">시장 개요</button>
  <button data-tab="stock">종목</button>
  <button data-tab="qsf">점수</button>
  <button data-tab="macro">거시</button>
  <button data-tab="watch">관심종목</button>
  <button data-tab="portfolio">포트폴리오</button>
  <button data-tab="assist">매매 보조</button>
  <button data-tab="model">모델</button>
  <button data-tab="lab">연구실</button>
</nav>
<main>
  <section id="tab-overview" class="tab on"></section>
  <section id="tab-stock" class="tab"></section>
  <section id="tab-macro" class="tab"></section>
  <section id="tab-watch" class="tab"></section>
  <section id="tab-portfolio" class="tab"></section>
  <section id="tab-assist" class="tab"></section>
  <section id="tab-model" class="tab"></section>
  <section id="tab-lab" class="tab"></section>
  <section id="tab-qsf" class="tab"></section>
</main>
<footer class="foot">
  무료 공개 데이터(Yahoo Finance 지연 시세 · SEC EDGAR · FRED)만 사용합니다. 실시간 시세가 아니며, 투자 권유가 아닌 연구용 정보입니다.
  주문 기능은 없습니다. <span id="health"></span>
</footer>
<div id="tip" class="tip" hidden></div>
<script src="app.js"></script>
<script src="portfolio.js"></script>
<script src="lab.js"></script>
<script src="qsf.js"></script>
</body>
</html>
