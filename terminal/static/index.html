<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퀀트 터미널</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">퀀트 터미널 <span class="ver">QSF</span></div>
  <span class="seg" id="market" role="group" aria-label="시장"><button type="button" data-m="US">미국</button><button type="button" data-m="KR">한국</button><button type="button" data-m="COIN">코인</button></span>
  <form id="search" class="search" autocomplete="off">
    <input id="q" name="q" placeholder="종목 코드 또는 회사명" maxlength="30" aria-label="종목 코드 또는 회사명">
    <button type="submit">조회</button>
  </form>
  <button id="acctbtn" class="ghost" type="button" title="미국·한국 주식과 코인을 한 페이지에서 봅니다.">내 계좌</button>
  <button id="collect" class="ghost" type="button" title="최신 자료 수집: 매일 자동 실행과 같은 작업을 지금 시작합니다. 이미 끝난 단계는 건너뜁니다.">지금 수집</button>
  <button id="phonebtn" class="ghost" type="button" title="같은 와이파이의 휴대폰에서 이 화면을 엽니다. 기본은 꺼져 있습니다." hidden>폰 연결</button>
  <button id="cmdbtn" class="ghost" type="button" title="명령창 (/ 또는 ⌘K)" aria-label="명령창 열기">⌘K</button>
  <button id="theme" class="ghost" title="화면 테마 전환" aria-label="화면 테마 전환">◐</button>
  <div id="collectbar" class="collectbar" role="status" aria-live="polite" hidden></div>
  <div id="phonebar" class="phonebar" hidden></div>
  <div id="netbar" class="netbar" role="alert" hidden></div>
  <div id="verbar" class="verbar" role="status" hidden></div>
</header>
<nav class="groups" id="groups" aria-label="묶음">
  <button type="button" data-group="today" class="on">오늘</button>
  <button type="button" data-group="market">시장</button>
  <button type="button" data-group="stock">종목</button>
  <button type="button" data-group="chart">차트</button>
  <button type="button" data-group="account">내 계좌</button>
  <button type="button" data-group="score">점수</button>
  <button type="button" data-group="verify">검증·기록</button>
  <button type="button" data-group="coin" hidden>코인</button>
</nav>
<nav class="tabs" role="tablist" hidden>
  <button data-tab="today" data-group="today" class="on">오늘</button>
  <button data-tab="overview" data-group="market">시장 개요</button>
  <button data-tab="map" data-group="market">시장 지도</button>
  <button data-tab="macro" data-group="market">거시</button>
  <button data-tab="stock" data-group="stock">종목</button>
  <button data-tab="watch" data-group="stock">관심종목</button>
  <button data-tab="chart" data-group="chart">차트분석</button>
  <button data-tab="compare" data-group="chart">비교</button>
  <button data-tab="account" data-group="account">내 계좌</button>
  <button data-tab="portfolio" data-group="account">시장별 자세히</button>
  <button data-tab="assist" data-group="account">매매 보조</button>
  <button data-tab="paper" data-group="account">모의 매매</button>
  <button data-tab="qsf" data-group="score">점수</button>
  <button data-tab="committee" data-group="score">투자위원회</button>
  <button data-tab="model" data-group="verify">모델</button>
  <button data-tab="lab" data-group="verify">연구실</button>
  <button data-tab="coin" data-group="coin">코인</button>
</nav>
<main>
  <section id="tab-today" class="tab on"></section>
  <section id="tab-overview" class="tab"></section>
  <section id="tab-map" class="tab"></section>
  <section id="tab-stock" class="tab"></section>
  <section id="tab-compare" class="tab"></section>
  <section id="tab-chart" class="tab"></section>
  <section id="tab-macro" class="tab"></section>
  <section id="tab-watch" class="tab"></section>
  <section id="tab-account" class="tab"></section>
  <section id="tab-portfolio" class="tab"></section>
  <section id="tab-assist" class="tab"></section>
  <section id="tab-paper" class="tab"></section>
  <section id="tab-model" class="tab"></section>
  <section id="tab-lab" class="tab"></section>
  <section id="tab-qsf" class="tab"></section>
  <section id="tab-committee" class="tab"></section>
  <section id="tab-coin" class="tab"></section>
</main>
<footer class="foot">
  무료 공개 데이터(Yahoo Finance 지연 시세 · SEC EDGAR · FRED)만 사용합니다. 실시간 시세가 아니며, 투자 권유가 아닌 연구용 정보입니다.
  주문 기능은 없습니다. <span id="health"></span>
</footer>
<div id="tip" class="tip" hidden></div>
<script src="app.js"></script>
<script src="portfolio.js"></script>
<script src="account.js"></script>
<script src="paper.js"></script>
<script src="alerts.js"></script>
<script src="calendar.js"></script>
<script src="lab.js"></script>
<script src="qsf.js"></script>
<script src="committee.js"></script>
<script src="forecast.js"></script>
<script src="compare.js"></script>
<script src="chart.js"></script>
<script src="map.js"></script>
<script src="rotation.js"></script>
<script src="sectorpicks.js"></script>
<script src="peers.js"></script>
<script src="assistant.js"></script>
<script src="coin.js"></script>
<script src="command.js"></script>
<script src="collect.js"></script>
<script src="phone.js"></script>
</body>
</html>
