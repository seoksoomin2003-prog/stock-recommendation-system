# Runs the whole test suite and a start-up check on Windows (Windows port, 2026-11-27).
# Starts only when asked (Actions tab -> "windows-tests" -> Run workflow) or on a push to the "windows" branch.
name: windows-tests
on:
  workflow_dispatch:
  push:
    branches: [windows]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.lock
      - name: Tests
        shell: pwsh
        run: |
          .venv\Scripts\python.exe -m pytest -q -p no:cacheprovider --tb=short -o console_output_style=classic 2>&1 | Tee-Object -FilePath pytest_windows.log
          exit $LASTEXITCODE
      - name: Start-up check (scheduler entries and the server)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          .venv\Scripts\python.exe app.py automation status *> smoke_status.log
          "status exit $LASTEXITCODE" | Tee-Object -Append smoke.log
          .venv\Scripts\python.exe app.py terminal-agent install *>> smoke.log
          Start-Sleep -Seconds 25
          schtasks /Query /TN "QuantEngine Terminal" /V /FO LIST *>> smoke.log
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/health -TimeoutSec 20).Content | Tee-Object -Append smoke.log } catch { "HEALTH FAILED: $($_.Exception.Message)" | Tee-Object -Append smoke.log }
          try { "root " + (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/ -TimeoutSec 20).StatusCode | Tee-Object -Append smoke.log } catch { "ROOT FAILED: $($_.Exception.Message)" | Tee-Object -Append smoke.log }
          .venv\Scripts\python.exe app.py terminal-agent status *>> smoke.log
          .venv\Scripts\python.exe app.py terminal-agent uninstall *>> smoke.log
          if (Test-Path data\terminal\logs\launchd.log) { Get-Content data\terminal\logs\launchd.log -Tail 40 | Tee-Object -Append smoke.log }
          Get-Content smoke.log
      - name: Copy to hand over, installed from its zip with the real .bat file
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $out = Join-Path $env:RUNNER_TEMP "share_out"; $dst = Join-Path $env:RUNNER_TEMP "share_in"
          New-Item -ItemType Directory -Force $out, $dst | Out-Null
          .venv\Scripts\python.exe -X utf8 -c "import sys; from pathlib import Path; from terminal import share; r = share.make(Path('.'), Path(sys.argv[1])); print(r['status'], r['files'], r['records'], r['key_file'])" $out *> bundle.log
          $zip = Get-ChildItem $out -Filter *.zip | Select-Object -First 1
          if (-not $zip) { "NO ZIP" | Tee-Object -Append bundle.log; Get-Content bundle.log; exit 1 }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dst
          Set-Location (Join-Path $dst "quant-stock-engine")
          Get-ChildItem ops\windows | ForEach-Object { $_.Name } *>> $env:GITHUB_WORKSPACE\bundle.log
          cmd /c '"ops\windows\1 처음 설치.bat" < NUL' *>> $env:GITHUB_WORKSPACE\bundle.log
          "bat exit $LASTEXITCODE" | Tee-Object -Append $env:GITHUB_WORKSPACE\bundle.log
          if (-not (Test-Path .venv\Scripts\python.exe)) { "NO VENV FROM THE BAT FILE" | Tee-Object -Append $env:GITHUB_WORKSPACE\bundle.log; Get-Content $env:GITHUB_WORKSPACE\bundle.log; exit 1 }
          $p = Start-Process -PassThru -WindowStyle Hidden .venv\Scripts\python.exe -ArgumentList "-X","utf8","app.py","terminal","--port","8770"
          Start-Sleep -Seconds 25
          $ok = $true
          try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8770/api/health -TimeoutSec 20).Content | Tee-Object -Append $env:GITHUB_WORKSPACE\bundle.log } catch { $ok = $false; "BUNDLE HEALTH FAILED: $($_.Exception.Message)" | Tee-Object -Append $env:GITHUB_WORKSPACE\bundle.log }
          try { "root " + (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8770/ -TimeoutSec 20).StatusCode | Tee-Object -Append $env:GITHUB_WORKSPACE\bundle.log } catch { $ok = $false; "BUNDLE ROOT FAILED" | Tee-Object -Append $env:GITHUB_WORKSPACE\bundle.log }
          try { "status " + (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8770/api/automation/status -TimeoutSec 30).StatusCode | Tee-Object -Append $env:GITHUB_WORKSPACE\bundle.log } catch { $ok = $false; "BUNDLE STATUS FAILED" | Tee-Object -Append $env:GITHUB_WORKSPACE\bundle.log }
          Stop-Process -Id $p.Id -Force
          Get-Content $env:GITHUB_WORKSPACE\bundle.log
          if (-not $ok) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-logs
          path: |
            pytest_windows.log
            smoke.log
            smoke_status.log
            bundle.log

  mac-bundle:
    # A Mac that has never seen the program: the copy is made, unpacked the way Finder does it and installed with the real
    # .command file (the schedule is left out: a hosted computer must not start the daily collection).
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Make the copy
        run: |
          python3.14 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.lock
          mkdir -p "$RUNNER_TEMP/share_out" "$RUNNER_TEMP/share_in"
          .venv/bin/python -c "import sys; from pathlib import Path; from terminal import share; r = share.make(Path('.'), Path(sys.argv[1])); print(r['status'], r['files'], r['records'], r['key_file'])" "$RUNNER_TEMP/share_out"
      - name: Unpack and install with the .command file
        run: |
          ditto -x -k "$RUNNER_TEMP"/share_out/*.zip "$RUNNER_TEMP/share_in"
          cd "$RUNNER_TEMP/share_in/quant-stock-engine"
          ls -l ops
          QE_SKIP_SCHEDULE=1 zsh "ops/처음 설치.command"
          test -x .venv/bin/python
      - name: The unpacked copy starts and answers
        run: |
          cd "$RUNNER_TEMP/share_in/quant-stock-engine"
          .venv/bin/python app.py terminal --port 8770 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -m 3 http://127.0.0.1:8770/api/health && break; sleep 2; done
          curl -sf -m 20 http://127.0.0.1:8770/api/health
          curl -sf -m 20 -o /dev/null -w "root %{http_code}\n" http://127.0.0.1:8770/
          curl -sf -m 30 -o /dev/null -w "status %{http_code}\n" http://127.0.0.1:8770/api/automation/status
          .venv/bin/python app.py automation status | head -5
          kill %1 || true
      - name: Guard tests inside the unpacked copy
        run: |
          python3.14 -c "import socket, time; t = time.time(); socket.getfqdn('0.0.0.0'); print('name lookup of 0.0.0.0 took', round(time.time() - t, 1), 's')"
          cd "$RUNNER_TEMP/share_in/quant-stock-engine"
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_share_copy.py tests/test_phone_view.py tests/test_freeze_and_entry_book.py tests/test_rules_r2.py
